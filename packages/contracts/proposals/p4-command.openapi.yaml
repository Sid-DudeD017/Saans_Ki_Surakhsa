openapi: 3.1.0
info:
  title: Saans Command
  version: 1.0.0
  description: >-
    Saans Command (P4): reports in, cases out. Shapes follow src/domain/schemas (zod).
    Command's own status and action values stay uppercase (CONVENTIONS.md); shared codes are lowercase.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:3000
    description: Local development server
tags:
  - name: Command
    description: P4 · complaints, cases and the public board
paths:
  /v1/uploads:
    post:
      tags: [Command]
      summary: Get a presigned S3 URL for one photo or voice note
      description: >-
        PUT the file to upload_url with the given headers before it expires, then send object_key and the
        same sha256 as evidence in POST /v1/complaints.
      operationId: createUpload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadInput'
            example:
              media_type: image/jpeg
              byte_size: 1843200
              sha256: 9f2c4e7b1d0a5c3e8f6b2a4d7c9e1f3b5a7d9c2e4f6a8b0c1d3e5f7a9b2c4d6e
      responses:
        '201':
          description: Upload target created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTarget'
              example:
                object_key: evidence/2026/10/23/7c1e9a.jpg
                upload_url: https://saans-evidence.s3.ap-south-1.amazonaws.com/evidence/2026/10/23/7c1e9a.jpg?X-Amz-Signature=example
                method: PUT
                headers:
                  Content-Type: image/jpeg
                expires_at: '2026-10-23T14:15:00+05:30'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/IntakeUnavailable'
  /v1/complaints:
    post:
      tags: [Command]
      summary: Submit a report or a farmer's request for help
      description: >-
        A citizen's report (ComplaintInput) or Kisan Saathi's farmer_support request
        (FarmerSupportComplaint, P1). Repeating a request with the same Idempotency-Key and body returns
        the first response without creating a second record.
      operationId: submitComplaint
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 6
            maxLength: 128
          description: Client-generated unique id. Kisan uses the conversation's session id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ComplaintInput'
                - $ref: './p1-kisan.openapi.json#/components/schemas/FarmerSupportComplaint'
            example:
              type: farm_fire
              location:
                lat: 30.266
                lon: 76.04
              evidence:
                - object_key: evidence/2026/10/23/7c1e9a.jpg
                  media_type: image/jpeg
                  hash: 9f2c4e7b1d0a5c3e8f6b2a4d7c9e1f3b5a7d9c2e4f6a8b0c1d3e5f7a9b2c4d6e
                  captured_timestamp: '2026-10-23T13:58:00+05:30'
                  location:
                    lat: 30.2662
                    lon: 76.0401
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintResponse'
              example:
                id: complaint-8d2f41
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The Idempotency-Key was used before with a different body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: idempotency_conflict
                  message: this Idempotency-Key was used with a different request
        '503':
          $ref: '#/components/responses/IntakeUnavailable'
  /v1/cases:
    get:
      tags: [Command]
      summary: The officer's queue
      description: Only cases the signed-in officer may see (Cedar, by district). Nearest deadline first.
      operationId: listCases
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [OPEN, ACTION_APPROVED, ACTION_CHANGED, CLOSED]
        - name: district
          in: query
          required: false
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          description: next_cursor from the previous page
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: One page of the queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseList'
              example:
                cases:
                  - case:
                      id: case-1
                      incidentReportId: report-1
                      verificationStatus: SATELLITE_CORROBORATED
                      observationId: obs-1
                      helpRequestId: kisan-3f9c2a
                      recommendedMachineId: machine-1
                      evidenceSummary: FIRMS fire point 400 m from the report, 15 minutes before it
                      recommendationReason: Open help request for 1.5 acres; Happy Seeder free 6 km away
                      status: OPEN
                      version: 1
                      createdAt: '2026-10-23T14:02:00+05:30'
                      updatedAt: '2026-10-23T14:02:00+05:30'
                    type: farm_fire
                    district: Sangrur
                    location:
                      lat: 30.266
                      lon: 76.04
                    deadline: '2026-10-23T18:02:00+05:30'
                    hasHelpRequest: true
                next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/cases/{id}:
    get:
      tags: [Command]
      summary: One case, with its report, satellite match and the farmer's open help request
      operationId: getCase
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: The case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
              example:
                case:
                  id: case-1
                  incidentReportId: report-1
                  verificationStatus: SATELLITE_CORROBORATED
                  observationId: obs-1
                  helpRequestId: kisan-3f9c2a
                  recommendedMachineId: machine-1
                  status: OPEN
                  version: 1
                  createdAt: '2026-10-23T14:02:00+05:30'
                  updatedAt: '2026-10-23T14:02:00+05:30'
                report:
                  id: report-1
                  reportedAt: '2026-10-23T14:00:00+05:30'
                  reporterId: citizen-123
                  location:
                    lat: 30.266
                    lon: 76.04
                  description: Thick smoke visible from the main road.
                  district: Sangrur
                  status: OPEN
                observation:
                  id: obs-1
                  source: NASA_FIRMS
                  observedAt: '2026-10-23T13:45:00+05:30'
                  location:
                    lat: 30.2624
                    lon: 76.04
                  confidence: 85
                  brightness: 320.5
                  distanceFromReportMeters: 400
                helpRequest:
                  id: kisan-3f9c2a
                  farmerId: kisan-farmer-3f9c2a
                  farmLocation:
                    lat: 30.266
                    lon: 76.04
                  district: Sangrur
                  crop: Paddy
                  acreage: 18
                  machineType: Happy Seeder
                  requiredFrom: '2026-10-20T00:00:00+05:30'
                  requiredUntil: '2026-11-09T00:00:00+05:30'
                  coveragePercent: 92
                  uncoveredAcres: 1.5
                  status: OPEN
                recommendedMachine:
                  id: machine-1
                  chcId: chc-bhaini
                  chcName: Bhaini CHC
                  location:
                    lat: 30.284
                    lon: 76.04
                  machineType: Happy Seeder
                  availableFrom: '2026-11-01T00:00:00+05:30'
                  availableUntil: '2026-11-30T00:00:00+05:30'
                  status: AVAILABLE
                  capacityAcresPerDay: 8
                decisions: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/cases/{id}/actions:
    post:
      tags: [Command]
      summary: Act on a case
      description: >-
        APPROVE, CHANGE or REJECT the recommendation (an OfficerDecision), or move the case along.
        previousCaseVersion must match the case's version, so two officers can't overwrite each other.
      operationId: takeCaseAction
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseActionInput'
            example:
              action: APPROVE
              selectedMachineId: machine-1
              reason: Help request open for 1.5 acres; send the Happy Seeder before any penalty.
              previousCaseVersion: 1
      responses:
        '200':
          description: The case after the action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandCase'
              example:
                id: case-1
                incidentReportId: report-1
                verificationStatus: SATELLITE_CORROBORATED
                observationId: obs-1
                helpRequestId: kisan-3f9c2a
                recommendedMachineId: machine-1
                status: ACTION_APPROVED
                version: 2
                createdAt: '2026-10-23T14:02:00+05:30'
                updatedAt: '2026-10-23T14:20:00+05:30'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The case changed since previousCaseVersion (version_conflict), or is closed (conflict)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: version_conflict
                  message: the case is at version 2; reload it and decide again
  /v1/public/board:
    get:
      tags: [Command]
      summary: Anonymised public statistics
      description: >-
        Counts by district from app data. Cells under min_cell_size are reported as null so no farm or
        reporter can be picked out. No names, phones or precise locations.
      operationId: getPublicBoard
      security: []
      responses:
        '200':
          description: The board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBoard'
              example:
                as_of: '2026-10-23T15:00:00+05:30'
                min_cell_size: 5
                districts:
                  - district: Sangrur
                    reports: 42
                    satellite_corroborated: 31
                    help_requests: 18
                    machines_sent: 12
                    acres_cleared_without_fire: 96.5
                    median_resolution_hours: 20.5
                  - district: Patiala
                    reports: 9
                    satellite_corroborated: 6
                    help_requests: null
                    machines_sent: null
                    acres_cleared_without_fire: null
                    median_resolution_hours: null
        '503':
          description: The board is being recomputed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: unavailable
                  message: the board is being recomputed; try again in a minute
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Cognito id token (from G7). Kisan Saathi files with a service credential. On the local stack, the
        case endpoints take a demo officer's token from infra/config/officers.local.json.
  parameters:
    CaseId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: The request doesn't match the contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: invalid_request
              message: location.lat must be a number from -90 to 90
              details:
                - field: body.location.lat
                  problem: must be a number from -90 to 90
    Unauthorized:
      description: Not signed in
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: unauthorized
              message: sign in again
    Forbidden:
      description: Signed in, but not allowed (another district, say)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: forbidden
              message: this case is in another district
    IntakeUnavailable:
      description: >-
        Intake can't reach its database, storage or workflow right now. A complaint may already be saved:
        send it again with the same Idempotency-Key, which never adds a second one.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: unavailable
              message: the complaint is saved but its processing didn't start; send it again with the same Idempotency-Key
    NotFound:
      description: No such case
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: not_found
              message: no case with that id
  schemas:
    GeoPoint:
      type: object
      additionalProperties: false
      required: [lat, lon]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
    IndiaTimestamp:
      type: string
      format: date-time
      pattern: '\+05:30$'
      description: ISO 8601 with the +05:30 offset
      examples: ['2026-10-23T14:02:00+05:30']
    UploadInput:
      type: object
      required: [media_type, byte_size, sha256]
      properties:
        media_type:
          type: string
          enum: [image/jpeg, image/png, image/heic, audio/mp4, audio/ogg, audio/wav]
        byte_size:
          type: integer
          minimum: 1
          maximum: 15728640
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    UploadTarget:
      type: object
      required: [object_key, upload_url, method, headers, expires_at]
      properties:
        object_key:
          type: string
        upload_url:
          type: string
          format: uri
        method:
          type: string
          enum: [PUT]
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          $ref: '#/components/schemas/IndiaTimestamp'
    ComplaintInput:
      type: object
      description: A citizen's report. Kisan's farmer_support requests use FarmerSupportComplaint instead.
      required: [type, location, evidence]
      properties:
        type:
          type: string
          enum: [farm_fire, garbage, vehicle, firecrackers]
        location:
          $ref: '#/components/schemas/GeoPoint'
        description:
          type: string
          maxLength: 1000
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceMetadata'
    EvidenceMetadata:
      type: object
      required: [object_key, media_type, hash, captured_timestamp]
      properties:
        object_key:
          type: string
        media_type:
          type: string
        hash:
          type: string
          description: sha256 of the uploaded file, as sent to POST /v1/uploads
        captured_timestamp:
          type: string
          format: date-time
        location:
          $ref: '#/components/schemas/GeoPoint'
    ComplaintResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [received]
    IncidentReport:
      type: object
      required: [id, reportedAt, reporterId, location, description, district, status]
      properties:
        id:
          type: string
        reportedAt:
          $ref: '#/components/schemas/IndiaTimestamp'
        reporterId:
          type: string
        location:
          $ref: '#/components/schemas/GeoPoint'
        description:
          type: string
        mediaUrls:
          type: array
          items:
            type: string
            format: uri
        district:
          type: string
        status:
          type: string
          enum: [OPEN, CLOSED]
    SatelliteObservation:
      type: object
      description: >-
        The FIRMS fire that corroborated a farm-fire report: within 1 km, seen in the 12 hours before it.
      required: [id, source, observedAt, location, confidence]
      properties:
        id:
          type: string
        source:
          type: string
          enum: [NASA_FIRMS, SEED]
        observedAt:
          $ref: '#/components/schemas/IndiaTimestamp'
        location:
          $ref: '#/components/schemas/GeoPoint'
        confidence:
          type: number
          description: 0-100. VIIRS reports low, nominal or high, sent as 30, 60 and 90.
        brightness:
          type: number
        frp:
          type: number
        distanceFromReportMeters:
          type: number
    HelpRequest:
      type: object
      description: >-
        A farmer's shortfall after the zero-burn plan. Kisan sends extra fields for the case view
        (KisanHelpRequest in P1's proposal); they are allowed.
      required: [id, farmerId, farmLocation, district, crop, acreage, machineType, requiredFrom, requiredUntil,
                 coveragePercent, uncoveredAcres, status]
      properties:
        id:
          type: string
        farmerId:
          type: string
        farmLocation:
          $ref: '#/components/schemas/GeoPoint'
        district:
          type: string
        crop:
          type: string
        acreage:
          type: number
        machineType:
          type: string
        requiredFrom:
          $ref: '#/components/schemas/IndiaTimestamp'
        requiredUntil:
          $ref: '#/components/schemas/IndiaTimestamp'
        coveragePercent:
          type: number
        uncoveredAcres:
          type: number
        status:
          type: string
          enum: [OPEN, MATCHED, FULFILLED, EXPIRED]
    MachineAsset:
      type: object
      required: [id, chcId, chcName, location, machineType, availableFrom, availableUntil, status]
      properties:
        id:
          type: string
        chcId:
          type: string
        chcName:
          type: string
        location:
          $ref: '#/components/schemas/GeoPoint'
        machineType:
          type: string
        availableFrom:
          $ref: '#/components/schemas/IndiaTimestamp'
        availableUntil:
          $ref: '#/components/schemas/IndiaTimestamp'
        status:
          type: string
          enum: [AVAILABLE, IN_USE, MAINTENANCE]
        capacityAcresPerDay:
          type: number
    CommandCase:
      type: object
      required: [id, incidentReportId, verificationStatus, status, version, createdAt, updatedAt]
      properties:
        id:
          type: string
        incidentReportId:
          type: string
        verificationStatus:
          type: string
          enum: [UNVERIFIED, SATELLITE_CORROBORATED, NO_MATCH, NEEDS_REVIEW]
        observationId:
          type: string
        helpRequestId:
          type: string
        recommendedMachineId:
          type: string
        evidenceSummary:
          type: string
        recommendationReason:
          type: string
        status:
          type: string
          enum: [OPEN, ACTION_APPROVED, ACTION_CHANGED, CLOSED]
        version:
          type: integer
        createdAt:
          $ref: '#/components/schemas/IndiaTimestamp'
        updatedAt:
          $ref: '#/components/schemas/IndiaTimestamp'
    OfficerDecision:
      type: object
      required: [id, caseId, officerId, action, reason, createdAt, previousCaseVersion]
      properties:
        id:
          type: string
        caseId:
          type: string
        officerId:
          type: string
        action:
          type: string
          description: ESCALATE is written by Saans itself (officerId saans-escalation) when a deadline passes
          enum: [APPROVE, CHANGE, REJECT, MARK_IN_FIELD, RECORD_ACTION_TAKEN, CLOSE, ESCALATE]
        selectedMachineId:
          type: string
        reason:
          type: string
          minLength: 1
        createdAt:
          $ref: '#/components/schemas/IndiaTimestamp'
        previousCaseVersion:
          type: integer
    CaseSummary:
      type: object
      required: [case, type, district, location, deadline, hasHelpRequest]
      properties:
        case:
          $ref: '#/components/schemas/CommandCase'
        type:
          type: string
          enum: [farm_fire, garbage, vehicle, firecrackers, farmer_support]
        district:
          type: string
        location:
          $ref: '#/components/schemas/GeoPoint'
        deadline:
          $ref: '#/components/schemas/IndiaTimestamp'
        hasHelpRequest:
          type: boolean
          description: The farm has an open help request, shown before any penalty
        penalty:
          type: boolean
          description: Whether routing.json allows a penalty for this type (never for farmer_support)
        authorities:
          type: array
          items:
            type: string
        reports:
          type: integer
          minimum: 1
          description: Reports in this case; duplicates (same type, within 150 m and 6 hours) merge into one
        escalatedAt:
          $ref: '#/components/schemas/IndiaTimestamp'
        escalatedTo:
          type: array
          description: Set with escalatedAt, when the deadline passed before any officer acted
          items:
            type: string
    CaseList:
      type: object
      required: [cases, next_cursor]
      properties:
        cases:
          type: array
          items:
            $ref: '#/components/schemas/CaseSummary'
        next_cursor:
          type: [string, 'null']
    CaseDetail:
      type: object
      required: [case, report, decisions]
      properties:
        case:
          $ref: '#/components/schemas/CommandCase'
        report:
          $ref: '#/components/schemas/IncidentReport'
        observation:
          $ref: '#/components/schemas/SatelliteObservation'
        helpRequest:
          $ref: '#/components/schemas/HelpRequest'
        recommendedMachine:
          $ref: '#/components/schemas/MachineAsset'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/OfficerDecision'
        type:
          type: string
          enum: [farm_fire, garbage, vehicle, firecrackers, farmer_support]
        penalty:
          type: boolean
        authorities:
          type: array
          items:
            type: string
        deadline:
          $ref: '#/components/schemas/IndiaTimestamp'
        reports:
          type: integer
          minimum: 1
          description: Reports in this case; duplicates (same type, within 150 m and 6 hours) merge into one
        escalatedAt:
          $ref: '#/components/schemas/IndiaTimestamp'
        escalatedTo:
          type: array
          description: Set with escalatedAt, when the deadline passed before any officer acted
          items:
            type: string
        helpLink:
          type: object
          description: >-
            How a fire report was linked to the nearest open help request (within 5 km). ambiguous: another
            open request was within 100 m of the same distance, so the officer should check which farm.
          required: [distanceMeters, ambiguous]
          properties:
            distanceMeters:
              type: number
            ambiguous:
              type: boolean
            otherHelpRequestId:
              type: string
    CaseActionInput:
      type: object
      required: [action, reason, previousCaseVersion]
      properties:
        action:
          type: string
          enum: [APPROVE, CHANGE, REJECT, MARK_IN_FIELD, RECORD_ACTION_TAKEN, CLOSE]
        selectedMachineId:
          type: string
          description: Needed for CHANGE
        reason:
          type: string
          minLength: 1
        previousCaseVersion:
          type: integer
    PublicBoardDistrict:
      type: object
      required: [district, reports, satellite_corroborated, help_requests, machines_sent,
                 acres_cleared_without_fire, median_resolution_hours]
      properties:
        district:
          type: string
        reports:
          type: [integer, 'null']
        satellite_corroborated:
          type: [integer, 'null']
        help_requests:
          type: [integer, 'null']
        machines_sent:
          type: [integer, 'null']
        acres_cleared_without_fire:
          type: [number, 'null']
        median_resolution_hours:
          type: [number, 'null']
    PublicBoard:
      type: object
      required: [as_of, min_cell_size, districts]
      properties:
        as_of:
          $ref: '#/components/schemas/IndiaTimestamp'
        min_cell_size:
          type: integer
          description: Counts below this are null
        districts:
          type: array
          items:
            $ref: '#/components/schemas/PublicBoardDistrict'
    ErrorEnvelope:
      type: object
      description: >-
        Every error from every Saans service has this body (CONVENTIONS.md). code is for programs; message
        is a sentence the app can show; details lists the fields that failed validation.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
    ErrorCode:
      type: string
      description: Add new codes here, in lowercase.
      enum:
        - invalid_request
        - unauthorized
        - forbidden
        - not_found
        - no_coverage
        - conflict
        - idempotency_conflict
        - version_conflict
        - payload_too_large
        - unavailable
        - sources_unavailable
    ErrorDetail:
      type: object
      required: [field, problem]
      properties:
        field:
          type: string
          description: Where, as a dotted path (body.paddy.value, query.lat)
        problem:
          type: string
    EventContract:
      type: object
      required: [event_id, version, occurrence_time, correlation_id, event_name, payload]
      properties:
        event_id:
          type: string
        version:
          type: string
        occurrence_time:
          type: string
          format: date-time
        correlation_id:
          type: string
        event_name:
          type: string
          enum:
            - complaint_received
            - complaint_triaged
            - case_assigned
            - case_escalated
            - action_taken
            - case_closed
            - reporter_notified
        payload:
          type: object
          discriminator:
            propertyName: event_name
    PayloadComplaintReceived:
      type: object
      required: [complaint_id, reporter_id]
      properties:
        complaint_id:
          type: string
        reporter_id:
          type: string
    PayloadComplaintTriaged:
      type: object
      required: [complaint_id, priority]
      properties:
        complaint_id:
          type: string
        priority:
          type: string
    PayloadCaseAssigned:
      type: object
      required: [complaint_id, assignee_id, deadline]
      properties:
        complaint_id:
          type: string
        assignee_id:
          type: string
        deadline:
          type: string
          format: date-time
    PayloadCaseEscalated:
      type: object
      required: [complaint_id, new_assignee_id, reason]
      properties:
        complaint_id:
          type: string
        new_assignee_id:
          type: string
        reason:
          type: string
    PayloadActionTaken:
      type: object
      required: [complaint_id, action_description]
      properties:
        complaint_id:
          type: string
        action_description:
          type: string
    PayloadCaseClosed:
      type: object
      required: [complaint_id, resolution_status]
      properties:
        complaint_id:
          type: string
        resolution_status:
          type: string
    PayloadReporterNotified:
      type: object
      required: [complaint_id, notification_type]
      properties:
        complaint_id:
          type: string
        notification_type:
          type: string
