  /v1/allocations:
    post:
      summary: Allocations
      description: "Suggested machine for each open help request: earliest wheat deadline first, nearest machine first."
      operationId: allocations
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllocationRequest"
            example:
              helpRequests:
                - id: kisan-3f9c2a
                  farmerId: kisan-farmer-3f9c2a
                  farmLocation:
                    lat: 30.266
                    lon: 76.04
                  district: Sangrur
                  crop: Paddy
                  acreage: 18
                  machineType: Happy Seeder
                  requiredFrom: 2026-10-20T00:00:00+05:30
                  requiredUntil: 2026-11-09T00:00:00+05:30
                  coveragePercent: 92
                  uncoveredAcres: 1.5
                  status: OPEN
              machineAssets:
                - id: machine-1
                  chcId: demo-chc-b
                  chcName: Demo CHC B, Bhawanigarh
                  location:
                    lat: 30.32
                    lon: 76.04
                  machineType: Happy Seeder
                  availableFrom: 2026-11-01T00:00:00+05:30
                  availableUntil: 2026-11-30T00:00:00+05:30
                  status: AVAILABLE
                  capacityAcresPerDay: 7
              today: 2026-10-08
        required: true
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocationResponse"
              example:
                assignments:
                  - helpRequestId: kisan-3f9c2a
                    machineId: machine-1
                    chcId: demo-chc-b
                    chcName: Demo CHC B, Bhawanigarh
                    machineType: Happy Seeder
                    date: 2026-11-01
                    acres: 1.5
                    distanceKm: 6
                    substitute: false
                    reason: "priority 1 of 1: wheat deadline 2026-11-09; 6.0 km away"
                unassigned: []
                order:
                  - kisan-3f9c2a
                acresCovered: 1.5
                acresRequested: 1.5
                fullyCovered: 1
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: invalid_request
                  message: "body.helpRequests: Field required"
                  details:
                    - field: body.helpRequests
                      problem: Field required
      tags:
        - Kisan
      security: []
      x-owner: P1
    servers:
      - url: http://localhost:8010
        description: Kisan Saathi on a laptop
  /v1/aqi:
    get:
      summary: Get AQI for a location
      operationId: get_aqi_v1_aqi_get
      description: Returns the CPCB National AQI for the requested location using inverse-distance weighting across nearby stations. Includes per-pollutant sub-indices, GRAP stage, wind, and weather.
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lon
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
          description: Longitude. Always 'lon', never 'lng'.
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AqiResponse"
              examples:
                good_day:
                  summary: Good Day — AQI 45, dominant pm25
                  value:
                    aqi: 45
                    category: good
