    UploadInput:
      type: object
      required:
        - media_type
        - byte_size
        - sha256
      properties:
        media_type:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/heic
            - audio/mp4
            - audio/ogg
            - audio/wav
        byte_size:
          type: integer
          minimum: 1
          maximum: 15728640
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
    UploadTarget:
      type: object
      required:
        - object_key
        - upload_url
        - method
        - headers
        - expires_at
      properties:
        object_key:
          type: string
        upload_url:
          type: string
          format: uri
        method:
          type: string
          enum:
            - PUT
