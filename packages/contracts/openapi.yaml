      required:
        - speed_kmh
        - direction_deg
      title: Wind
  responses:
    BadRequest:
      description: The request doesn't match the contract
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: invalid_request
              message: location.lat must be a number from -90 to 90
              details:
                - field: body.location.lat
                  problem: must be a number from -90 to 90
    Forbidden:
      description: Signed in, but not allowed (another district, say)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: forbidden
              message: this case is in another district
    IntakeUnavailable:
      description: "Intake can't reach its database, storage or workflow right now. A complaint may already be saved: send it again with the same Idempotency-Key, which never adds a second one."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: unavailable
              message: the complaint is saved but its processing didn't start; send it again with the same Idempotency-Key
    NotFound:
      description: No such case
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: not_found
              message: no case with that id
    Unauthorized:
      description: Not signed in
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: unauthorized
              message: sign in again
  parameters:
    CaseId:
      name: id
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Cognito id token (from G7). Kisan Saathi files with a service credential.
