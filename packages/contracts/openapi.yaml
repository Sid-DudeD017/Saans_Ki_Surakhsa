      description: Returns active fire detections from NASA FIRMS. Clients MUST specify the search area using EITHER a bounding box (`bbox`) OR a point-radius (`lat`, `lon`, `radius_km`). Do not provide an incomplete point-radius query (e.g. lat without lon or radius_km).
      parameters:
        - name: bbox
          in: query
          description: "Bounding box: minLon,minLat,maxLon,maxLat. Mutually exclusive with point-radius parameters."
          required: false
          schema:
            type: string
        - name: lat
          in: query
          description: Latitude of the center point.
          required: false
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lon
          in: query
          description: Longitude of the center point.
          required: false
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: radius_km
          in: query
          description: Search radius in kilometres.
          required: false
          schema:
            type: number
            exclusiveMinimum: 0
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiresResponse"
              examples:
                bbox_example:
                  summary: Bounding Box Search
                  description: "Example request: `/v1/fires?bbox=77.0,28.0,77.5,28.8`"
                  value:
                    fires:
                      - lat: 28.4
                        lon: 77.2
                        acquisition_time: 2026-10-08T13:30:00+05:30
                        satellite: VIIRS
                        confidence: nominal
                        frp: 12.5
                    count: 1
                    as_of: 2026-10-08T14:00:00+05:30
                point_radius_example:
                  summary: Point-Radius Search
                  description: "Example request: `/v1/fires?lat=28.6139&lon=77.2090&radius_km=25`"
                  value:
                    fires:
                      - lat: 28.5
                        lon: 77.3
                        acquisition_time: 2026-10-08T13:45:00+05:30
                        satellite: MODIS
                        confidence: high
                        frp: 45.2
                      - lat: 28.7
                        lon: 77.1
                        acquisition_time: 2026-10-08T13:45:00+05:30
                        satellite: MODIS
                        confidence: nominal
                        frp: 8
                    count: 2
                    as_of: 2026-10-08T14:00:00+05:30
        "404":
          description: No fire data available for the requested region
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: no_coverage
                  message: Requested bounding box is outside the supported coverage area.
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: invalid_request
                  message: Missing bbox or point-radius parameters
                  details:
                    - field: query.bbox
                      problem: required unless lat, lon and radius_km are given
        "503":
          description: NASA FIRMS data source is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: sources_unavailable
                  message: NASA FIRMS API failed to respond. Retry after 60 seconds.
      tags:
        - Air
      security: []
      x-owner: P3
    servers:
      - url: /
