    SchoolDay:
      type: object
      title: SchoolDay
      description: "Each part of the school day as src/config/school-rules.json decides it: the AQI band, and indoors at a heat index of 41 °C or more. The principal's board shows these."
      required:
        - aqi
        - heat_index_c
        - band
        - assembly
        - pe
        - recess
        - classroom_purifiers
        - outdoor_trips
        - parent_sms
        - commute_masks
        - heat_override
        - decision
        - severity
        - action_code
      properties:
        aqi:
          type: integer
          minimum: 0
          maximum: 500
        heat_index_c:
          type:
            - number
            - "null"
          description: From P3's weather; null when unknown, and then only the AQI decides.
        band:
          type: object
          required:
            - from
            - to
          properties:
            from:
              type: integer
            to:
              type: integer
          description: The AQI band used, inclusive.
        assembly:
          type: string
          enum:
            - outdoors
            - indoors
            - state_order
        pe:
          type: string
          enum:
            - normal
            - light_for_asthma
            - indoors
            - state_order
        recess:
          type: string
          enum:
            - outdoors
            - indoors
        classroom_purifiers:
          type: boolean
        outdoor_trips:
          type: boolean
        parent_sms:
          type: string
          enum:
            - none
            - once
            - every_morning
        commute_masks:
          type: boolean
        heat_override:
          type: boolean
          description: True when the heat index, not the AQI, moved something indoors.
        decision:
          $ref: "#/components/schemas/PrincipalDecision"
        severity:
          $ref: "#/components/schemas/AdvisorySeverity"
        action_code:
          $ref: "#/components/schemas/SchoolActionCode"
