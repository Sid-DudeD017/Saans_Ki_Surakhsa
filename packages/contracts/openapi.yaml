                  code: not_found
                  message: School with id 'school_999' not registered in monitoring database.
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: invalid_request
                  message: role must be one of the listed roles
                  details:
                    - field: query.role
                      problem: required
        "503":
