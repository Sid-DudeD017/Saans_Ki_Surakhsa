# Saans Command on AWS (SAM). G5 defines complaint intake; G7 deploys it to ap-south-1 and adds sign-in
# (Cognito), the database (RDS PostGIS) and the alarms. Intrinsics are written in long form (Fn::Sub,
# Ref) so the file is plain YAML that tests can read.
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Saans Command - uploads, complaints and the intake workflow (G5)

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, demo]
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: postgres:// URL of the PostGIS database (G7 replaces this with RDS and Secrets Manager)

  CorsAllowedOrigin:
    Type: String
    Default: "https://saans.local"
  CognitoDomainPrefix:
    Type: String
    Default: saans-dev
  AppCallbackUrl:
    Type: String
    Default: "http://localhost:3000/callback"
  AppLogoutUrl:
    Type: String
    Default: "http://localhost:3000/logout"
Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 15
    Environment:
      Variables:
        SAANS_DATABASE_URL:
          Ref: DatabaseUrl
        SAANS_EVIDENCE_BUCKET:
          Ref: EvidenceBucket
        SAANS_S3_ENDPOINT: ""
        NODE_OPTIONS: --enable-source-maps

Resources:
  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: saans-evidence-${Stage}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: 
              - Ref: CorsAllowedOrigin
            AllowedHeaders: ["*"]
            MaxAge: 600

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName:
        Ref: Stage
      CorsConfiguration:
        AllowOrigins:
          - Ref: CorsAllowedOrigin
        AllowMethods:
          - GET
          - POST
          - OPTIONS
      Auth:
        Authorizers:
          CustomAuthorizer:
            FunctionArn: {"Fn::GetAtt": ["AuthorizerFunction", "Arn"]}
            AuthorizerPayloadFormatVersion: '2.0'
            EnableSimpleResponses: true

  UploadsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/command-api/lambda.uploads
      CodeUri: ../
      Policies:
        - S3WritePolicy:
            BucketName:
              Ref: EvidenceBucket
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: Api
            Method: POST
            Path: /v1/uploads
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [services/command-api/lambda.ts]
        Target: node22
        Sourcemap: true

  ComplaintsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/command-api/lambda.complaints
      CodeUri: ../
      Environment:
        Variables:
          SAANS_STATE_MACHINE_ARN:
            Ref: IntakeStateMachine
      Policies:
        - StepFunctionsExecutionPolicy:
            StateMachineName:
              Fn::GetAtt: [IntakeStateMachine, Name]
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: Api
            Method: POST
            Path: /v1/complaints
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [services/command-api/lambda.ts]
        Target: node22
        Sourcemap: true

  ValidateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/workflows/lambda.validate
      CodeUri: ../
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [services/workflows/lambda.ts]
        Target: node22

  HashEvidenceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/workflows/lambda.hashEvidence
      CodeUri: ../
      Timeout: 60
      Policies:
        - S3ReadPolicy:
            BucketName:
              Ref: EvidenceBucket
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [services/workflows/lambda.ts]
        Target: node22

  TriageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/workflows/lambda.triage
      CodeUri: ../
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [services/workflows/lambda.ts]
        Target: node22

  AssignFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/workflows/lambda.assign
      CodeUri: ../
      Environment:
        Variables:
          SAANS_DLQ_URL:
            Ref: NotificationFailureDLQ
      Policies:
        - Statement:
            - Effect: Allow
              Action: sms-voice:SendTextMessage
              Resource: "*"
            - Effect: Allow
              Action: sqs:SendMessage
              Resource:
                Fn::GetAtt: [NotificationFailureDLQ, Arn]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [services/workflows/lambda.ts]
        Target: node22

  RecordFailureFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/workflows/lambda.recordFailure
      CodeUri: ../
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [services/workflows/lambda.ts]
        Target: node22

  IntakeStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      DefinitionUri: ../services/workflows/complaint-intake.asl.json
      DefinitionSubstitutions:
        ValidateFunctionArn:
          Fn::GetAtt: [ValidateFunction, Arn]
        HashEvidenceFunctionArn:
          Fn::GetAtt: [HashEvidenceFunction, Arn]
        TriageFunctionArn:
          Fn::GetAtt: [TriageFunction, Arn]
        AssignFunctionArn:
          Fn::GetAtt: [AssignFunction, Arn]
        RecordFailureFunctionArn:
          Fn::GetAtt: [RecordFailureFunction, Arn]
      Policies:
        - LambdaInvokePolicy:
            FunctionName:
              Ref: ValidateFunction
        - LambdaInvokePolicy:
            FunctionName:
              Ref: HashEvidenceFunction
        - LambdaInvokePolicy:
            FunctionName:
              Ref: TriageFunction
        - LambdaInvokePolicy:
            FunctionName:
              Ref: AssignFunction
        - LambdaInvokePolicy:
            FunctionName:
              Ref: RecordFailureFunction

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/command-api/health.health
      CodeUri: ../
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: Api
            Method: GET
            Path: /health
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [services/command-api/health.ts]
        Target: node22

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API Gateway 5xx
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: ApiId
          Value:
            Ref: Api
        - Name: Stage
          Value:
            Ref: Stage

  UploadsErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Uploads Function Errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: UploadsFunction

  ComplaintsErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Complaints Function Errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: ComplaintsFunction

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: saans-pool

  OfficerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: officer
      UserPoolId:
        Ref: CognitoUserPool
        
  DistrictSangrurGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: district-sangrur
      UserPoolId:
        Ref: CognitoUserPool
        
  DistrictPatialaGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: district-patiala
      UserPoolId:
        Ref: CognitoUserPool
      
  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: browser-app
      UserPoolId:
        Ref: CognitoUserPool
      GenerateSecret: false
      AllowedOAuthFlows: [code]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs:
        - Ref: AppCallbackUrl
      LogoutURLs:
        - Ref: AppLogoutUrl
      SupportedIdentityProviders: [COGNITO]

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain:
        Ref: CognitoDomainPrefix
      UserPoolId:
        Ref: CognitoUserPool

  PolicyStore:
    Type: AWS::VerifiedPermissions::PolicyStore
    Properties:
      ValidationSettings:
        Mode: STRICT
      Schema:
        CedarJson: '{"Saans": {"entityTypes": {"User": {"shape": {"type": "Record", "attributes": {}}, "memberOfTypes": ["UserGroup"]}, "UserGroup": {"shape": {"type": "Record", "attributes": {}}}, "Application": {"shape": {"type": "Record", "attributes": {}}}, "Case": {"shape": {"type": "Record", "attributes": {"district": {"type": "String", "required": true}}}}}, "actions": {"whoami": {"appliesTo": {"principalTypes": ["User"], "resourceTypes": ["Application"]}}, "list": {"appliesTo": {"principalTypes": ["User"], "resourceTypes": ["Case"]}}, "counts": {"appliesTo": {"principalTypes": ["User"], "resourceTypes": ["Case"]}}, "map": {"appliesTo": {"principalTypes": ["User"], "resourceTypes": ["Case"]}}, "detail": {"appliesTo": {"principalTypes": ["User"], "resourceTypes": ["Case"]}}, "evidence": {"appliesTo": {"principalTypes": ["User"], "resourceTypes": ["Case"]}}, "assign": {"appliesTo": {"principalTypes": ["User"], "resourceTypes": ["Case"]}}, "mark_in_field": {"appliesTo": {"principalTypes": ["User"], "resourceTypes": ["Case"]}}, "record_action": {"appliesTo": {"principalTypes": ["User"], "resourceTypes": ["Case"]}}, "close": {"appliesTo": {"principalTypes": ["User"], "resourceTypes": ["Case"]}}}}}'

  IdentitySource:
    Type: AWS::VerifiedPermissions::IdentitySource
    Properties:
      PolicyStoreId:
        Ref: PolicyStore
      PrincipalEntityType: Saans::User
      Configuration:
        CognitoUserPoolConfiguration:
          UserPoolArn:
            Fn::GetAtt: [CognitoUserPool, Arn]
          ClientIds:
            - Ref: CognitoUserPoolClient
          GroupConfiguration:
            GroupEntityType: Saans::UserGroup

  WhoamiPolicy:
    Type: AWS::VerifiedPermissions::Policy
    Properties:
      PolicyStoreId:
        Ref: PolicyStore
      Definition:
        Static:
          Statement: |
            permit (
                principal,
                action == Saans::Action::"whoami",
                resource
            )
            when {
                principal in Saans::UserGroup::"officer"
            };

  CasesPolicy:
    Type: AWS::VerifiedPermissions::Policy
    Properties:
      PolicyStoreId:
        Ref: PolicyStore
      Definition:
        Static:
          Statement: |
            permit (
                principal,
                action in [
                    Saans::Action::"list",
                    Saans::Action::"counts",
                    Saans::Action::"map",
                    Saans::Action::"detail",
                    Saans::Action::"evidence",
                    Saans::Action::"assign",
                    Saans::Action::"mark_in_field",
                    Saans::Action::"record_action",
                    Saans::Action::"close"
                ],
                resource
            )
            when {
                principal in Saans::UserGroup::"officer" &&
                ((principal in Saans::UserGroup::"district-sangrur" && resource.district == "sangrur") ||
                 (principal in Saans::UserGroup::"district-patiala" && resource.district == "patiala"))
            };

  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/command-api/authorizer.authorizer
      CodeUri: ../
      Environment:
        Variables:
          COGNITO_USER_POOL_ID:
            Ref: CognitoUserPool
          COGNITO_CLIENT_ID:
            Ref: CognitoUserPoolClient
          VERIFIED_PERMISSIONS_POLICY_STORE_ID:
            Ref: PolicyStore
      Policies:
        - Statement:
            - Effect: Allow
              Action: verifiedpermissions:IsAuthorizedWithToken
              Resource:
                Fn::Sub: "arn:aws:verifiedpermissions:${AWS::Region}:${AWS::AccountId}:policy-store/${PolicyStore}"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [services/command-api/authorizer.ts]
        Target: node22

  WhoamiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/command-api/whoami.handler
      CodeUri: ../
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: Api
            Method: GET
            Path: /v1/officer/whoami
            Auth:
              Authorizer: CustomAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [services/command-api/whoami.ts]
        Target: node22

  NotificationFailureDLQ:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

Outputs:
  NotificationFailureDlqUrl:
    Value:
      Ref: NotificationFailureDLQ
  NotificationFailureDlqArn:
    Value:
      Fn::GetAtt: [NotificationFailureDLQ, Arn]
  ApiUrl:
    Description: Base URL for SAANS_API_URL and NEXT_PUBLIC_API_BASE_URL (no /v1)
    Value:
      Fn::Sub: https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  EvidenceBucketName:
    Value:
      Ref: EvidenceBucket
  IntakeStateMachineArn:
    Value:
      Ref: IntakeStateMachine


  CognitoUserPoolId:
    Value:
      Ref: CognitoUserPool
  CognitoClientId:
    Value:
      Ref: CognitoUserPoolClient
  CognitoDomain:
    Value:
      Ref: CognitoUserPoolDomain

  PolicyStoreId:
    Value:
      Ref: PolicyStore
