version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Amplify gives server routes only what's written here: the database and the Kisan agent too, or
        # /v1/tickets, /v1/complaints and /v1/agent/kisan fall back to localhost and fail. The script quotes
        # each value so a `#` or `$` in a password survives (see scripts/amplify-env.mjs).
        - node scripts/amplify-env.mjs
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
