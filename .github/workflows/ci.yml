name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate Contracts
        run: |
          count=0
          while IFS= read -r -d '' file; do
            echo "Linting $file..."
            npx @redocly/cli lint "$file" || exit 1
            count=$((count + 1))
          done < <(find packages/contracts -type f \( -name "openapi.yaml" -o -name "openapi.yml" -o -name "*.openapi.json" -o -name "*.openapi.yaml" \) -print0)
          if [ "$count" -eq 0 ]; then
            echo "No contract files found."
            exit 1
          fi

      - name: Contracts are up to date
        # openapi.yaml and types.ts are built from the proposals; if this fails, run `npm run contracts`.
        run: |
          npm run contracts
          git diff --exit-code -- packages/contracts/openapi.yaml packages/contracts/types.ts

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "services/agent-kisan/uv.lock"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python tests (Agent Kisan)
        working-directory: services/agent-kisan
        run: uv run pytest

  command-intake:
    # G5: complaint intake on real PostGIS and LocalStack S3 (services/command-api/intake.stack.test.ts).
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: saans
          POSTGRES_PASSWORD: saans
          POSTGRES_DB: saans
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U saans -d saans"
          --health-interval 2s --health-timeout 3s --health-retries 30
      localstack:
        # The last LocalStack release that runs without an account token; see infra/compose.yaml.
        image: localstack/localstack:4.14.0
        env:
          SERVICES: s3
          AWS_DEFAULT_REGION: ap-south-1
          S3_SKIP_SIGNATURE_VALIDATION: "0"
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://127.0.0.1:4566/_localstack/health"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Intake and cases on PostGIS + LocalStack
        env:
          SAANS_DATABASE_URL: postgres://saans:saans@127.0.0.1:5433/saans
        run: npx vitest run services/command-api/intake.stack.test.ts services/command-api/cases.stack.test.ts
