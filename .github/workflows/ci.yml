name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate Contracts
        run: |
          count=0
          while IFS= read -r -d '' file; do
            echo "Linting $file..."
            npx @redocly/cli lint "$file" || exit 1
            count=$((count + 1))
          done < <(find packages/contracts -type f \( -name "*.yaml" -o -name "*.yml" -o -name "*.json" \) -print0)
          if [ "$count" -eq 0 ]; then
            echo "No contract files found."
            exit 1
          fi

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "services/agent-kisan/uv.lock"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python tests (Agent Kisan)
        working-directory: services/agent-kisan
        run: uv run pytest
