name: Deploy Saans to AWS

on:
  workflow_dispatch:
  push:
    branches:
      - p4/g7-aws-foundation

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-saans-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/p4/g7-aws-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          allowed-account-ids: "054266242578"

      - name: Validate SAM template
        run: sam validate --region ap-south-1 --template-file infra/template.yaml

      - name: Build SAM application
        run: >-
          env
          PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          NODE_PATH="$GITHUB_WORKSPACE/node_modules"
          sam build --template-file infra/template.yaml

      - name: Deploy SAM application
        run: >-
          sam deploy
          --stack-name saans-dev
          --region ap-south-1
          --resolve-s3
          --capabilities CAPABILITY_IAM
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --parameter-overrides
          Stage=dev
          DatabaseSecretArn="${{ vars.DATABASE_SECRET_ARN }}"
          CorsAllowedOrigin="http://localhost:3000"
          CognitoDomainPrefix="saans-dev-054266242578"
          AppCallbackUrl="http://localhost:3000/callback"
          AppLogoutUrl="http://localhost:3000/logout"

      - name: Show stack outputs
        run: >-
          aws cloudformation describe-stacks
          --region ap-south-1
          --stack-name saans-dev
          --query 'Stacks[0].Outputs'
          --output table
