[project]
name = "agent-kisan"
version = "0.1.0"
description = "Kisan Saathi: farmer intake agent and stubble coverage engine"
requires-python = ">=3.12"
dependencies = [
    "botocore[crt]>=1.43.109",
    "fastapi>=0.142.4",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "strands-agents>=1.58.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
asr = [
    "av<16",
    "faster-whisper>=1.2.1",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_kisan"]

[tool.uv]
# asr = local Whisper for development; the deployed image leaves it out (speech runs on SageMaker).
default-groups = ["dev", "asr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
